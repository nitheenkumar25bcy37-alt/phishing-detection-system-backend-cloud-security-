<!-- extension/popup.html -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 320px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        button { 
            width: 100%; padding: 10px; background: #2563eb; color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
        #resultContainer { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; }
        .SAFE { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .WARN { background: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .BLOCK { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        #scoreDisplay { font-weight: bold; font-size: 1.2em; margin-bottom: 5px; }
        .reasons { font-size: 0.85em; margin: 0; padding-left: 20px; }
    </style>
</head>
<body>
    <h3>🛡️ Phishing Shield AI</h3>
    <button id="scanBtn">Analyze Current Page</button>
    
    <div id="resultContainer">
        <div id="scoreDisplay"></div>
        <ul id="reasonsList" class="reasons"></ul>
    </div>

    <script src="popup.js"></script>
</body>
</html>
